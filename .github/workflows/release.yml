name: Release

# Se déclenche uniquement sur les tags de release (ex: v0.1.0-alpha.1, v1.0.0)
on:
  push:
    tags:
      - "v*"

jobs:
  # ─── Build multi-plateforme ──────────────────────────────────────────────────
  build:
    permissions:
      contents: write  # nécessaire pour uploader sur la Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel via universal binary)
          - platform: macos-latest
            args: --target universal-apple-darwin

          # Windows 64 bits
          - platform: windows-latest
            args: ""

          # Linux (AppImage + .deb)
          - platform: ubuntu-24.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. pnpm + Node.js
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      # 2 bis. La version du tag doit être celle de l'app, sinon l'updater ne propose jamais la release.
      - name: Check release version
        run: node scripts/release-version.mjs check "${{ github.ref_name }}"

      # 3. Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets nécessaires pour le universal binary macOS (Intel + Apple Silicon)
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 4. Dépendances système Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # 4 bis. Sans clé de signature, aucun artefact de mise à jour n'est produit : on échoue tôt et clairement.
      - name: Check updater signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant : voir RELEASING.md"
            exit 1
          fi

      # 4 ter. Clé Unsplash de l'application (obligatoire) : jamais dans le dépôt, injectée à la compilation.
      - name: Check Unsplash key
        shell: bash
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          if [ -z "$UNSPLASH_KEY" ]; then
            echo "::error::Secret UNSPLASH_ACCESS_KEY manquant : voir RELEASING.md"
            exit 1
          fi

      # 5. Build Tauri + upload sur la Release GitHub (+ latest.json lu par les apps installées)
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé de signature pour les mises à jour automatiques
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Clé Unsplash de l'application : compilée dans le binaire, jamais dans le dépôt
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dayali ${{ github.ref_name }}"
          releaseBody: "Nouvelle version de Dayali. Le détail des changements est sur la page de la release."
          releaseDraft: true   # créé en brouillon : à publier manuellement une fois les 3 builds terminés
          # Jamais « pré-release » : l'URL .../releases/latest/download/latest.json, lue par les apps
          # installées, ignore les pré-releases (et les brouillons). Une alpha marquée ainsi
          # ne serait donc jamais proposée en mise à jour.
          prerelease: false
          args: ${{ matrix.args }}
