name: Release

# Se déclenche uniquement sur les tags de release (ex: v0.1.0-alpha.1, v1.0.0)
on:
  push:
    tags:
      - "v*"

jobs:
  # ─── Build multi-plateforme ──────────────────────────────────────────────────
  build:
    permissions:
      contents: write  # nécessaire pour uploader sur la Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel via universal binary)
          - platform: macos-latest
            args: --target universal-apple-darwin

          # Windows 64 bits
          - platform: windows-latest
            args: ""

          # Linux (AppImage + .deb)
          - platform: ubuntu-24.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js + pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install frontend dependencies
        run: pnpm install

      # 3. Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets nécessaires pour le universal binary macOS (Intel + Apple Silicon)
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 4. Dépendances système Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # 5. Build Tauri + upload sur la Release GitHub
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé de signature pour les mises à jour automatiques
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dayali ${{ github.ref_name }}"
          releaseBody: |
            Voir les [notes de version](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).
          releaseDraft: true   # créé en brouillon, tu valides manuellement
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          args: ${{ matrix.args }}
