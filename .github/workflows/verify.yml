name: Verify

# Équivalent CI de `pnpm verify` (+ lint) : exécuté sur chaque push vers `main`
# et sur chaque pull request. N'utilise AUCUN secret et seulement `pull_request`
# (jamais `pull_request_target`) : le code d'une fork ne peut donc rien lire.
on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège : lecture seule du dépôt.
permissions:
  contents: read

# Un nouveau push annule la vérification devenue obsolète de la même branche.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Backend Rust (check, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri exige que `frontendDist` (../dist) existe à la compilation ; le
      # bundle réel est vérifié par le job `web`, un index factice suffit ici.
      - name: Stub frontend dist
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
